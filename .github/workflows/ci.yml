name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: kanban_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanban -d kanban_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kanban:ci-test-only@127.0.0.1:5432/kanban_test
      TEST_DATABASE_URL: postgresql://kanban:ci-test-only@127.0.0.1:5432/kanban_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy --config prisma.config.ts
      - run: npx prisma migrate deploy --config prisma.config.ts
      - run: npm test
